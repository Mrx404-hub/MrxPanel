<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MRX — Multi Firebase Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;
  --bg2:#0f1420;
  --bg3:#151b2b;
  --card:rgba(20,25,40,.65);
  --card-hi:rgba(28,35,55,.75);
  --border:rgba(255,255,255,.07);
  --border-hi:rgba(255,255,255,.13);
  --text:#f1f5f9;
  --sub:#94a3b8;
  --dim:#475569;
  --p:#a855f7;
  --c:#06b6d4;
  --rose:#f43f5e;
  --lime:#84cc16;
  --amber:#f59e0b;
  --emerald:#10b981;
  --grad:linear-gradient(135deg,#a855f7 0%,#06b6d4 100%);
  --grad2:linear-gradient(135deg,#f43f5e 0%,#a855f7 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 10% 20%,rgba(168,85,247,.12),transparent 60%),
    radial-gradient(ellipse 70% 50% at 90% 80%,rgba(6,182,212,.10),transparent 60%),
    radial-gradient(ellipse 60% 40% at 50% 50%,rgba(244,63,94,.05),transparent 60%);
  animation:meshShift 20s ease-in-out infinite;
}
@keyframes meshShift{
  0%,100%{transform:scale(1) rotate(0deg);opacity:1;}
  50%{transform:scale(1.15) rotate(3deg);opacity:.85;}
}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
@keyframes shimmer{0%{background-position:-200% center;}100%{background-position:200% center;}}
@keyframes pop{0%{transform:scale(.9);opacity:0;}60%{transform:scale(1.03);}100%{transform:scale(1);opacity:1;}}
@keyframes newMsg{0%{transform:translateX(-8px);opacity:0;}100%{transform:translateX(0);opacity:1;}}

/* ── Login ── */
#loginScreen{
  position:fixed;inset:0;z-index:10;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-box{
  width:100%;max-width:420px;
  background:var(--card);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--border-hi);
  border-radius:24px;
  padding:44px 38px 38px;
  position:relative;overflow:hidden;
  animation:fadeUp .6s cubic-bezier(.22,1,.36,1);
  box-shadow:0 30px 100px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;
}
.login-box::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad);background-size:200% 100%;
  animation:shimmer 3s linear infinite;
}
.login-dots{
  position:absolute;top:20px;right:24px;
  display:flex;gap:6px;
}
.login-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.08);}
.login-dots i:nth-child(1){background:rgba(168,85,247,.6);}
.login-dots i:nth-child(2){background:rgba(6,182,212,.6);}
.login-dots i:nth-child(3){background:rgba(244,63,94,.6);}
.login-logo{
  font-family:'Space Grotesk',sans-serif;
  font-size:64px;font-weight:700;letter-spacing:-4px;
  background:var(--grad);background-size:200% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:shimmer 4s linear infinite;
  text-align:center;line-height:1;margin-bottom:10px;
}
.login-tag{
  text-align:center;font-size:11px;font-weight:600;
  letter-spacing:4px;text-transform:uppercase;color:var(--sub);
  margin-bottom:36px;
}
.login-field{margin-bottom:20px;}
.login-field label{
  display:block;font-size:10px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--sub);margin-bottom:8px;
}
.login-field input{
  width:100%;padding:15px 18px;
  background:rgba(10,14,26,.6);
  border:1px solid var(--border);
  border-radius:12px;color:var(--text);
  font-family:'JetBrains Mono',monospace;
  font-size:14px;outline:none;
  transition:all .25s cubic-bezier(.22,1,.36,1);
}
.login-field input:focus{
  border-color:rgba(168,85,247,.5);
  background:rgba(10,14,26,.9);
  box-shadow:0 0 0 4px rgba(168,85,247,.1);
}
.login-field input::placeholder{color:var(--dim);}
.login-btn{
  width:100%;padding:16px;border:none;border-radius:12px;
  background:var(--grad);background-size:200% 100%;
  color:#fff;font-family:'Inter',sans-serif;
  font-size:15px;font-weight:700;letter-spacing:.3px;
  cursor:pointer;position:relative;overflow:hidden;
  transition:all .3s cubic-bezier(.22,1,.36,1);
  box-shadow:0 8px 32px rgba(168,85,247,.35);
  animation:shimmer 4s linear infinite;
}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(168,85,247,.5);}
.login-btn:active{transform:translateY(0);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.login-err{
  margin-top:16px;padding:12px 16px;
  background:rgba(244,63,94,.08);
  border:1px solid rgba(244,63,94,.25);
  border-radius:10px;color:var(--rose);
  font-size:12px;font-weight:600;text-align:center;
  animation:fadeUp .3s ease;
}
.login-foot{
  margin-top:28px;padding-top:20px;
  border-top:1px solid var(--border);
  text-align:center;font-size:10px;font-weight:600;
  letter-spacing:2px;text-transform:uppercase;color:var(--dim);
}
.login-foot span{
  background:var(--grad);background-size:200% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:shimmer 3s linear infinite;
}

/* ── Dashboard ── */
#dashboard{display:none;height:100vh;flex-direction:column;position:relative;z-index:1;}
#dashboard.open{display:flex;}

.topbar{
  height:58px;flex-shrink:0;
  display:flex;align-items:center;gap:16px;padding:0 24px;
  background:rgba(10,14,26,.85);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:relative;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(168,85,247,.4),rgba(6,182,212,.3),transparent);
}
.brand{
  font-family:'Space Grotesk',sans-serif;
  font-size:26px;font-weight:700;letter-spacing:-1.5px;
  background:var(--grad);background-size:200% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;animation:shimmer 4s linear infinite;
  margin-right:8px;
}
.topbar-search{
  flex:1;max-width:400px;
  display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:rgba(15,20,32,.6);
  border:1px solid var(--border);border-radius:10px;
  transition:all .2s;
}
.topbar-search:focus-within{
  border-color:rgba(168,85,247,.4);
  background:rgba(15,20,32,.9);
  box-shadow:0 0 0 3px rgba(168,85,247,.08);
}
.topbar-search svg{width:14px;height:14px;color:var(--dim);flex-shrink:0;}
.topbar-search input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:'Inter',sans-serif;font-size:13px;
}
.topbar-search input::placeholder{color:var(--dim);}
.topbar-pills{display:flex;gap:6px;margin-left:auto;}
.pill{
  font-size:10px;font-weight:700;
  padding:4px 10px;border-radius:20px;letter-spacing:.3px;
  display:inline-flex;align-items:center;gap:5px;
}
.pill b{font-weight:800;}
.pill.tot{background:rgba(168,85,247,.12);color:var(--p);}
.pill.on{background:rgba(16,185,129,.12);color:var(--emerald);}
.pill.off{background:rgba(244,63,94,.1);color:var(--rose);}
.pill.fb{background:rgba(6,182,212,.1);color:var(--c);}
.live-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--emerald);box-shadow:0 0 10px var(--emerald);
  animation:pulse 2s infinite;
}
.icon-btn{
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  background:rgba(20,25,40,.6);border:1px solid var(--border);
  border-radius:9px;color:var(--sub);cursor:pointer;
  transition:all .2s cubic-bezier(.22,1,.36,1);
}
.icon-btn:hover{
  color:var(--text);border-color:var(--border-hi);
  background:rgba(28,35,55,.8);transform:translateY(-1px);
}
.icon-btn svg{width:15px;height:15px;}

.body{display:flex;flex:1;overflow:hidden;}

.side{
  width:280px;flex-shrink:0;
  background:rgba(10,14,26,.5);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.side-sec{padding:14px 16px 8px;flex-shrink:0;}
.side-title{
  font-size:9px;font-weight:700;letter-spacing:2px;
  text-transform:uppercase;color:var(--dim);
  margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.side-title::after{content:'';flex:1;height:1px;background:var(--border);}
.fb-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.fb-item{
  padding:9px 12px;border-radius:9px;background:transparent;
  border:1px solid transparent;cursor:pointer;
  display:flex;align-items:center;gap:9px;
  font-size:12px;font-weight:600;color:var(--sub);
  transition:all .15s cubic-bezier(.22,1,.36,1);
  animation:slideIn .2s ease;
}
.fb-item:hover{background:rgba(255,255,255,.03);color:var(--text);}
.fb-item.active{
  background:rgba(168,85,247,.1);
  border-color:rgba(168,85,247,.25);color:var(--text);
}
.fb-item .fdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--grad);}
.fb-item .fname{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.fb-item .fcount{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  background:rgba(255,255,255,.05);color:var(--sub);
}
.fb-item.active .fcount{background:rgba(168,85,247,.2);color:var(--p);}

.dev-scroll{flex:1;overflow-y:auto;padding:4px 8px 8px;}
.dev-empty{
  text-align:center;padding:50px 20px;
  color:var(--dim);font-size:12px;
}
.dev-empty svg{width:32px;height:32px;margin-bottom:12px;opacity:.5;}
.dev-item{
  padding:10px 12px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;gap:10px;
  transition:all .15s cubic-bezier(.22,1,.36,1);
  border:1px solid transparent;animation:slideIn .2s ease;
}
.dev-item:hover{background:rgba(255,255,255,.03);border-color:var(--border);}
.dev-item.active{
  background:rgba(168,85,247,.08);
  border-color:rgba(168,85,247,.25);
}
.dev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dev-dot.on{background:var(--emerald);box-shadow:0 0 8px rgba(16,185,129,.7);animation:pulse 2s infinite;}
.dev-dot.off{background:var(--dim);}
.dev-meta{flex:1;min-width:0;}
.dev-name{
  font-size:12px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;
}
.dev-num{
  font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dev-batt{
  font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;flex-shrink:0;
}
.side-foot{
  padding:12px 16px;border-top:1px solid var(--border);
  flex-shrink:0;display:flex;gap:8px;
}
.side-foot button{
  flex:1;padding:9px;background:rgba(20,25,40,.6);
  border:1px solid var(--border);border-radius:9px;
  color:var(--sub);font-family:'Inter',sans-serif;
  font-size:10px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;cursor:pointer;transition:all .2s;
}
.side-foot button:hover{color:var(--text);border-color:var(--border-hi);}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.main-inner{flex:1;overflow-y:auto;padding:26px 30px;}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin-bottom:24px;
}
.stat{
  background:var(--card);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:16px;
  padding:20px;position:relative;overflow:hidden;
  transition:all .3s cubic-bezier(.22,1,.36,1);
  animation:fadeUp .4s ease backwards;
}
.stat:nth-child(1){animation-delay:.05s;}
.stat:nth-child(2){animation-delay:.1s;}
.stat:nth-child(3){animation-delay:.15s;}
.stat:nth-child(4){animation-delay:.2s;}
.stat:hover{transform:translateY(-3px);border-color:var(--border-hi);box-shadow:0 20px 50px rgba(0,0,0,.4);}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.stat.s1::before{background:linear-gradient(90deg,#a855f7,#c084fc);}
.stat.s2::before{background:linear-gradient(90deg,#10b981,#34d399);}
.stat.s3::before{background:linear-gradient(90deg,#f43f5e,#fb7185);}
.stat.s4::before{background:linear-gradient(90deg,#06b6d4,#22d3ee);}
.stat-val{
  font-family:'Space Grotesk',sans-serif;
  font-size:44px;font-weight:700;letter-spacing:-2px;
  line-height:1;margin-bottom:6px;
  animation:pop .5s cubic-bezier(.34,1.56,.64,1);
}
.stat.s1 .stat-val{color:#c084fc;}
.stat.s2 .stat-val{color:#34d399;}
.stat.s3 .stat-val{color:#fb7185;}
.stat.s4 .stat-val{color:#22d3ee;}
.stat-lbl{
  font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--sub);
}
.stat-glow{
  position:absolute;bottom:-30px;right:-20px;
  width:100px;height:100px;border-radius:50%;
  filter:blur(40px);opacity:.2;pointer-events:none;
}
.stat.s1 .stat-glow{background:#a855f7;}
.stat.s2 .stat-glow{background:#10b981;}
.stat.s3 .stat-glow{background:#f43f5e;}
.stat.s4 .stat-glow{background:#06b6d4;}

.section{margin-bottom:26px;animation:fadeUp .4s ease backwards;animation-delay:.25s;}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.section-head h3{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px;font-weight:600;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--sub);
}
.section-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

.dev-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:12px;
}
.dev-card{
  background:var(--card);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:14px;
  padding:16px;cursor:pointer;position:relative;overflow:hidden;
  transition:all .25s cubic-bezier(.22,1,.36,1);
}
.dev-card:hover{
  transform:translateY(-3px);
  border-color:rgba(168,85,247,.35);
  box-shadow:0 16px 40px rgba(0,0,0,.4),0 0 0 1px rgba(168,85,247,.1);
}
.dev-card-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:8px;margin-bottom:12px;
}
.dev-card-name{
  font-size:13px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dev-card-num{
  font-size:11px;font-family:'JetBrains Mono',monospace;
  color:var(--sub);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.dev-card-status{
  font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px;
  letter-spacing:.5px;text-transform:uppercase;flex-shrink:0;
}
.dev-card-status.on{background:rgba(16,185,129,.15);color:var(--emerald);}
.dev-card-status.off{background:rgba(244,63,94,.1);color:var(--rose);}
.dev-card-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:12px;border-top:1px solid var(--border);
}
.dev-batt-bar{
  flex:1;height:4px;background:rgba(255,255,255,.05);
  border-radius:4px;overflow:hidden;margin-right:10px;
}
.dev-batt-fill{height:100%;border-radius:4px;transition:width .5s;}
.dev-batt-txt{
  font-size:10px;font-weight:700;
  font-family:'JetBrains Mono',monospace;flex-shrink:0;
}
.dev-card-fb{
  position:absolute;top:0;right:0;
  padding:3px 8px;font-size:8px;font-weight:800;
  letter-spacing:.5px;text-transform:uppercase;
  border-radius:0 14px 0 10px;
  background:rgba(168,85,247,.15);color:var(--p);
  max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.empty{text-align:center;padding:70px 20px;color:var(--dim);}
.empty svg{width:48px;height:48px;margin-bottom:16px;opacity:.4;}
.empty p{font-size:13px;font-weight:500;}
.loading{
  display:flex;align-items:center;justify-content:center;
  padding:80px 20px;gap:12px;color:var(--sub);font-size:13px;
}
.spinner{
  width:20px;height:20px;border-radius:50%;
  border:2px solid rgba(168,85,247,.2);
  border-top-color:var(--p);border-right-color:var(--c);
  animation:spin .8s linear infinite;
}

/* Device detail */
.detail-head{
  background:var(--card);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:18px;
  padding:24px;margin-bottom:20px;
  display:flex;align-items:center;gap:20px;
  position:relative;overflow:hidden;animation:fadeUp .4s ease;
}
.detail-head::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad);background-size:200% 100%;
  animation:shimmer 4s linear infinite;
}
.detail-icon{
  width:64px;height:64px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--grad);background-size:200% 100%;
  border-radius:18px;
  animation:float 4s ease-in-out infinite, shimmer 4s linear infinite;
  box-shadow:0 10px 30px rgba(168,85,247,.3);
}
.detail-icon svg{width:30px;height:30px;color:#fff;}
.detail-meta{flex:1;min-width:0;}
.detail-name{
  font-family:'Space Grotesk',sans-serif;
  font-size:24px;font-weight:700;letter-spacing:-.5px;
  margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap;}
.dbadge{
  font-size:10px;font-weight:700;padding:4px 10px;
  border-radius:20px;letter-spacing:.3px;
}
.dbadge.on{background:rgba(16,185,129,.13);color:var(--emerald);}
.dbadge.off{background:rgba(244,63,94,.1);color:var(--rose);}
.dbadge.purp{background:rgba(168,85,247,.13);color:var(--p);}
.dbadge.cyan{background:rgba(6,182,212,.13);color:var(--c);}
.dbadge.amber{background:rgba(245,158,11,.13);color:var(--amber);}
.dbadge.lime{background:rgba(132,204,22,.13);color:var(--lime);}

.detail-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:12px;margin-bottom:20px;
}
.dcard{
  background:var(--card);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:13px;
  padding:16px;transition:all .2s;
}
.dcard:hover{border-color:var(--border-hi);transform:translateY(-2px);}
.dcard-lbl{
  font-size:9px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--dim);margin-bottom:8px;
}
.dcard-val{
  font-size:15px;font-weight:700;color:var(--text);
  word-break:break-word;line-height:1.3;
}
.dcard-val.mono{font-family:'JetBrains Mono',monospace;font-size:12px;}
.dcard-val.phone{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--c);}
.dcard-val.ip{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--lime);}

/* Messages */
.msg-list{display:flex;flex-direction:column;gap:10px;}
.msg{
  background:var(--card);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-left:3px solid var(--p);
  border-radius:13px;padding:16px 18px;transition:all .2s;
  animation:fadeUp .3s ease backwards;
}
.msg.in{border-left-color:var(--c);}
.msg.out{border-left-color:var(--emerald);}
.msg:hover{transform:translateX(4px);border-color:var(--border-hi);}
.msg-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.msg-from{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;font-weight:700;color:var(--text);
}
.msg-type{
  font-size:9px;font-weight:800;padding:3px 8px;
  border-radius:5px;letter-spacing:.5px;text-transform:uppercase;
}
.msg-type.in{background:rgba(6,182,212,.15);color:var(--c);}
.msg-type.out{background:rgba(16,185,129,.13);color:var(--emerald);}
.msg-time{
  font-size:10px;color:var(--dim);
  font-family:'JetBrains Mono',monospace;margin-left:auto;
}
.msg-text{font-size:14px;line-height:1.6;color:#cbd5e1;word-break:break-word;}

.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-input{
  flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
  padding:9px 14px;background:rgba(15,20,32,.6);
  border:1px solid var(--border);border-radius:10px;transition:all .2s;
}
.filter-input:focus-within{border-color:rgba(168,85,247,.4);background:rgba(15,20,32,.9);}
.filter-input svg{width:13px;height:13px;color:var(--dim);}
.filter-input input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-family:'Inter',sans-serif;font-size:13px;
}
.filter-input input::placeholder{color:var(--dim);}
.chip{
  padding:8px 14px;background:rgba(15,20,32,.6);
  border:1px solid var(--border);border-radius:10px;
  color:var(--sub);font-family:'Inter',sans-serif;
  font-size:12px;font-weight:600;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.chip:hover{color:var(--text);border-color:var(--border-hi);}
.chip.active{
  background:rgba(168,85,247,.13);
  border-color:rgba(168,85,247,.3);color:var(--p);
}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);display:none;
  align-items:center;justify-content:center;
  z-index:500;padding:20px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--bg2);border:1px solid var(--border-hi);
  border-radius:20px;padding:28px;width:100%;max-width:420px;
  box-shadow:0 40px 100px rgba(0,0,0,.7);
  animation:pop .25s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad2);background-size:200% 100%;
  animation:shimmer 2s linear infinite;
}
.modal-title{
  font-family:'Space Grotesk',sans-serif;
  font-size:20px;font-weight:700;margin-bottom:20px;
}
.modal-btns{display:flex;gap:8px;margin-top:20px;}
.mc{
  flex:1;padding:11px;background:rgba(20,25,40,.6);
  border:1px solid var(--border);border-radius:9px;
  color:var(--sub);font-family:'Inter',sans-serif;
  font-weight:600;cursor:pointer;font-size:13px;transition:all .15s;
}
.mc:hover{color:var(--text);border-color:var(--border-hi);}
.mo{
  flex:2;padding:11px;background:var(--grad);
  border:none;border-radius:9px;color:#fff;
  font-family:'Inter',sans-serif;font-weight:700;
  cursor:pointer;font-size:13px;transition:all .2s;
}
.mo:hover{filter:brightness(1.1);}

/* Toast */
.toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:rgba(20,25,40,.95);
  backdrop-filter:blur(20px);
  border:1px solid var(--border-hi);
  color:var(--text);font-size:13px;font-weight:600;
  padding:12px 24px;border-radius:14px;z-index:999;
  opacity:0;transition:all .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;white-space:nowrap;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}

</head>
<body>
  <script>
// ═══════ STATE ═══════
let ACCESS_KEY = '';
let FIREBASES = [];        // [{name, url, key}]
let allDevices = [];        // [{...device, _fb: {name,url,key}}]
let filteredDevices = [];
let currentFB = 'all';
let currentSearch = '';
let devicePollTimer = null;

// ═══════ BOOT ═══════
window.addEventListener('DOMContentLoaded', async () => {
  // Auto-login from session storage
  const saved = sessionStorage.getItem('mrx_access');
  if (saved) {
    document.getElementById('accessInput').value = saved;
    doLogin();
  }
  // Enter key on login
  document.getElementById('accessInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});

// ═══════ LOGIN ═══════
async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginErr');
  const input = document.getElementById('accessInput').value.trim();

  errEl.style.display = 'none';

  if (!input) {
    errEl.textContent = 'Please enter access key';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    // Load access.json
    const accessRes = await fetch('access.json?t=' + Date.now());
    if (!accessRes.ok) throw new Error('access.json not found');
    const accessData = await accessRes.json();

    if (input !== accessData.accessKey) {
      throw new Error('Invalid access key');
    }

    // Load firebase.json
    const fbRes = await fetch('firebase.json?t=' + Date.now());
    if (!fbRes.ok) throw new Error('firebase.json not found');
    const fbData = await fbRes.json();

    if (!fbData.firebases || !Array.isArray(fbData.firebases) || fbData.firebases.length === 0) {
      throw new Error('No firebases configured');
    }

    ACCESS_KEY = input;
    FIREBASES = fbData.firebases;

    sessionStorage.setItem('mrx_access', input);

    // Show dashboard
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('open');

    // Init
    renderFBList();
    await loadAllDevices();
    startDevicePoll();

  } catch (e) {
    errEl.textContent = '❌ ' + e.message;
    errEl.style.display = 'block';
  }

  btn.disabled = false;
  btn.textContent = '🔓 Unlock Access';
}

function logout() {
  sessionStorage.removeItem('mrx_access');
  location.reload();
}

// ═══════ FIREBASE LIST ═══════
function renderFBList() {
  const el = document.getElementById('fbList');
  const allCount = allDevices.length;

  const html = `
    <div class="fb-item${currentFB === 'all' ? ' active' : ''}" onclick="setFB('all')">
      <div class="fdot"></div>
      <div class="fname">All Firebases</div>
      <div class="fcount">${allCount}</div>
    </div>
  ` + FIREBASES.map((fb, i) => {
    const count = allDevices.filter(d => d._fb.name === fb.name).length;
    return `
      <div class="fb-item${currentFB === i ? ' active' : ''}" onclick="setFB(${i})">
        <div class="fdot"></div>
        <div class="fname">${esc(fb.name)}</div>
        <div class="fcount">${count}</div>
      </div>
    `;
  }).join('');

  el.innerHTML = html;
}

function setFB(id) {
  currentFB = id;
  renderFBList();
  applyFilter();
}

// ═══════ LOAD DEVICES ═══════
async function loadAllDevices() {
  allDevices = [];

  // Fetch all firebases in parallel
  const results = await Promise.allSettled(
    FIREBASES.map(fb => fetchDevicesFromFB(fb))
  );

  results.forEach((r, i) => {
    if (r.status === 'fulfilled' && Array.isArray(r.value)) {
      allDevices.push(...r.value);
    } else {
      console.warn('Failed to load', FIREBASES[i].name, r.reason);
    }
  });

  renderStats();
  renderFBList();
  applyFilter();
}

async function fetchDevicesFromFB(fb) {
  const url = `${fb.url.replace(/\/$/, '')}/clients.json?auth=${encodeURIComponent(fb.key)}`;
  const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return parseDevices(data, fb);
}

function parseDevices(data, fb) {
  const devs = [];
  if (!data || typeof data !== 'object') return devs;

  Object.entries(data).forEach(([id, d]) => {
    if (!d || typeof d !== 'object') return;
    const sims = Array.isArray(d.sims) ? d.sims : (d.sims && typeof d.sims === 'object' ? Object.values(d.sims) : []);

    devs.push({
      id,
      fbKey: id,
      name: d.modelName || d.model || d.deviceName || id,
      batteryRaw: d.battery ?? '—',
      batteryNum: parseBattery(d.battery),
      status: !!d.status,
      mobNo: formatPhone(d.mobNo || (sims[0]?.phoneNumber || '')),
      ip: d.ip_address || '—',
      android: d.androidV || '—',
      storage: d.storage || '—',
      joined: d.joined || '—',
      sdkV: d.sdkV || '—',
      cpuArch: d.cpu_arch || '—',
      isRoot: !!d.isRoot,
      isSdCard: !!d.isSdCard,
      serviceProvider: d.service_provider || '',
      sims,
      _fb: fb,
    });
  });

  return devs;
}

function parseBattery(val) {
  if (val === null || val === undefined) return NaN;
  return parseInt(String(val).replace('%', '').trim());
}

function formatPhone(num) {
  if (!num || num === '—') return '—';
  const s = String(num).replace(/\D/g, '');
  if (s.startsWith('91') && s.length === 12) return '+' + s;
  if (s.length === 10) return '+91' + s;
  if (s.length > 0) return '+' + s;
  return '—';
}

// ═══════ RENDER STATS ═══════
function renderStats() {
  const total = allDevices.length;
  const on = allDevices.filter(d => d.status).length;
  const off = total - on;
  const sims = allDevices.reduce((a, d) => a + d.sims.length, 0);

  document.getElementById('stTotal').textContent = total;
  document.getElementById('stOnline').textContent = on;
  document.getElementById('stOffline').textContent = off;
  document.getElementById('stSims').textContent = sims;

  document.getElementById('pT').textContent = total;
  document.getElementById('pOn').textContent = on;
  document.getElementById('pOff').textContent = off;
  document.getElementById('pFB').textContent = FIREBASES.length;
}

// ═══════ FILTER ═══════
function applySearch() {
  currentSearch = (document.getElementById('globalSearch').value || '').toLowerCase().trim();
  applyFilter();
}

function applyFilter() {
  // Filter by FB
  let list = allDevices;
  if (currentFB !== 'all') {
    const fbName = FIREBASES[currentFB].name;
    list = list.filter(d => d._fb.name === fbName);
  }

  // Filter by search
  if (currentSearch) {
    list = list.filter(d =>
      d.name.toLowerCase().includes(currentSearch) ||
      d.id.toLowerCase().includes(currentSearch) ||
      d.mobNo.toLowerCase().includes(currentSearch)
    );
  }

  filteredDevices = list;
  renderDeviceGrid();
  renderSidebarDevices();
}

// ═══════ DEVICE GRID ═══════
function renderDeviceGrid() {
  const el = document.getElementById('deviceGrid');
  const titleEl = document.getElementById('sectionTitle');

  if (!filteredDevices.length) {
    titleEl.textContent = 'All Devices';
    el.innerHTML = `
      <div class="empty" style="grid-column:1/-1;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
        <p>No devices found</p>
      </div>`;
    return;
  }

  titleEl.textContent = `Devices (${filteredDevices.length})`;

  el.innerHTML = filteredDevices.map(d => {
    const bv = d.batteryNum;
    const bc = isNaN(bv) ? 'var(--dim)' : bv >= 60 ? 'var(--emerald)' : bv >= 30 ? 'var(--amber)' : 'var(--rose)';
    const bp = isNaN(bv) ? 0 : Math.min(100, Math.max(0, bv));
    const bd = isNaN(bv) ? d.batteryRaw : bv + '%';

    return `
      <div class="dev-card" onclick="openDevice('${esc(d._fb.name)}', '${esc(d.id)}')">
        <div class="dev-card-fb">${esc(d._fb.name)}</div>
        <div class="dev-card-head">
          <div style="min-width:0;flex:1;">
            <div class="dev-card-name">${esc(d.name)}</div>
            <div class="dev-card-num">${esc(d.mobNo)}</div>
          </div>
          <div class="dev-card-status ${d.status ? 'on' : 'off'}">${d.status ? 'Online' : 'Offline'}</div>
        </div>
        <div class="dev-card-foot">
          <div class="dev-batt-bar">
            <div class="dev-batt-fill" style="width:${bp}%;background:${bc};"></div>
          </div>
          <div class="dev-batt-txt" style="color:${bc};">${bd}</div>
        </div>
      </div>
    `;
  }).join('');
}

// ═══════ SIDEBAR DEVICES ═══════
function renderSidebarDevices() {
  const el = document.getElementById('devList');

  if (!filteredDevices.length) {
    el.innerHTML = `
      <div class="dev-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 10h8M8 14h5"/></svg>
        <div>No devices</div>
      </div>`;
    return;
  }

  el.innerHTML = filteredDevices.map(d => {
    const bv = d.batteryNum;
    const bc = isNaN(bv) ? 'var(--dim)' : bv >= 60 ? 'var(--emerald)' : bv >= 30 ? 'var(--amber)' : 'var(--rose)';
    const bs = isNaN(bv)
      ? `color:var(--sub);background:rgba(255,255,255,.05)`
      : `color:${bc};background:${bc}22`;
    const bd = isNaN(bv) ? d.batteryRaw : bv + '%';

    return `
      <div class="dev-item" onclick="openDevice('${esc(d._fb.name)}', '${esc(d.id)}')">
        <div class="dev-dot ${d.status ? 'on' : 'off'}"></div>
        <div class="dev-meta">
          <div class="dev-name">${esc(d.name)}</div>
          <div class="dev-num">${esc(d.mobNo)}</div>
        </div>
        <div class="dev-batt" style="${bs}">${bd}</div>
      </div>
    `;
  }).join('');
}

// ═══════ DEVICE POLL ═══════
function startDevicePoll() {
  stopDevicePoll();
  devicePollTimer = setInterval(async () => {
    try {
      await loadAllDevices();
    } catch (e) { /* ignore */ }
  }, 10000);
}

function stopDevicePoll() {
  if (devicePollTimer) {
    clearInterval(devicePollTimer);
    devicePollTimer = null;
  }
}

async function refreshAll() {
  toast('🔄 Refreshing...');
  await loadAllDevices();
  toast('✅ Refreshed');
}

// ═══════ DEVICE DETAIL MODAL ═══════
async function openDevice(fbName, deviceId) {
  const dev = allDevices.find(d => d._fb.name === fbName && d.id === deviceId);
  if (!dev) return;

  document.getElementById('modalTitle').textContent = dev.name;

  const bv = dev.batteryNum;
  const bc = isNaN(bv) ? 'var(--dim)' : bv >= 60 ? 'var(--emerald)' : bv >= 30 ? 'var(--amber)' : 'var(--rose)';
  const bp = isNaN(bv) ? 0 : Math.min(100, Math.max(0, bv));
  const bd = isNaN(bv) ? dev.batteryRaw : bv + '%';

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-head">
      <div class="detail-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><line x1="12" y1="18" x2="12" y2="18"/></svg>
      </div>
      <div class="detail-meta">
        <div class="detail-name">${esc(dev.name)}</div>
        <div class="detail-badges">
          <span class="dbadge ${dev.status ? 'on' : 'off'}">${dev.status ? '● Online' : '● Offline'}</span>
          ${dev.isRoot ? '<span class="dbadge amber">⚡ Root</span>' : ''}
          ${dev.isSdCard ? '<span class="dbadge cyan">💾 SD</span>' : ''}
          ${dev.sims.length ? `<span class="dbadge purp">${dev.sims.length} SIM${dev.sims.length > 1 ? 's' : ''}</span>` : ''}
          <span class="dbadge purp">${esc(dev._fb.name)}</span>
        </div>
      </div>
    </div>

    <div class="detail-grid">
      <div class="dcard"><div class="dcard-lbl">Phone Number</div><div class="dcard-val phone">${esc(dev.mobNo)}</div></div>
      <div class="dcard"><div class="dcard-lbl">IP Address</div><div class="dcard-val ip">${esc(dev.ip)}</div></div>
      <div class="dcard"><div class="dcard-lbl">Battery</div><div class="dcard-val" style="color:${bc};">${bd}</div></div>
      <div class="dcard"><div class="dcard-lbl">Android</div><div class="dcard-val">${esc(dev.android)}</div></div>
      <div class="dcard"><div class="dcard-lbl">SDK</div><div class="dcard-val mono">${esc(dev.sdkV)}</div></div>
      <div class="dcard"><div class="dcard-lbl">CPU</div><div class="dcard-val mono">${esc(dev.cpuArch)}</div></div>
      <div class="dcard"><div class="dcard-lbl">Storage</div><div class="dcard-val">${esc(String(dev.storage))}</div></div>
      <div class="dcard"><div class="dcard-lbl">Provider</div><div class="dcard-val" style="color:var(--c);">${esc(dev.serviceProvider || '—')}</div></div>
      <div class="dcard"><div class="dcard-lbl">Joined</div><div class="dcard-val mono" style="font-size:11px;">${esc(String(dev.joined))}</div></div>
      <div class="dcard"><div class="dcard-lbl">Device ID</div><div class="dcard-val mono" style="font-size:10px;">${esc(dev.id)}</div></div>
    </div>

    ${dev.sims.length ? `
      <div class="section-head" style="margin-top:18px;"><h3>SIM Cards</h3></div>
      <div class="detail-grid">
        ${dev.sims.map((s, i) => `
          <div class="dcard">
            <div class="dcard-lbl" style="color:${i === 0 ? 'var(--c)' : 'var(--p)'};">SIM ${i + 1}</div>
            <div class="dcard-val phone">${esc(formatPhone(s.phoneNumber || s.phone || ''))}</div>
            <div class="dcard-val" style="font-size:11px;color:var(--sub);margin-top:6px;">${esc(s.carrierName || s.carrier || '—')}</div>
          </div>
        `).join('')}
      </div>
    ` : ''}

    <div class="section-head" style="margin-top:22px;"><h3>Messages</h3></div>
    <div id="modalMsgs">
      <div class="loading"><div class="spinner"></div> Loading messages...</div>
    </div>
  `;

  document.getElementById('detailModal').classList.add('open');

  // Load messages
  loadMessages(dev);
}

async function loadMessages(dev) {
  const el = document.getElementById('modalMsgs');
  try {
    const url = `${dev._fb.url.replace(/\/$/, '')}/messages/${dev.id}.json?auth=${encodeURIComponent(dev._fb.key)}`;
    const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    const msgs = parseMessages(data);
    if (!msgs.length) {
      el.innerHTML = `<div class="empty" style="padding:30px;"><p>No messages yet</p></div>`;
      return;
    }

    el.innerHTML = `<div class="msg-list">${msgs.slice(0, 100).map(m => `
      <div class="msg ${m.type === 'outgoing' ? 'out' : 'in'}">
        <div class="msg-head">
          <span class="msg-from">${esc(m.sender)}</span>
          <span class="msg-type ${m.type === 'outgoing' ? 'out' : 'in'}">${m.type}</span>
          <span class="msg-time">${esc(m.dateTime)}</span>
        </div>
        <div class="msg-text">${esc(m.message)}</div>
      </div>
    `).join('')}</div>`;

  } catch (e) {
    el.innerHTML = `<div class="empty" style="padding:30px;"><p>⚠ Failed to load messages</p></div>`;
  }
}

function parseMessages(data) {
  const msgs = [];
  if (!data) return msgs;

  const entries = Array.isArray(data) ? data.map((v, i) => [String(i), v]) : Object.entries(data);

  entries.forEach(([k, m]) => {
    if (m === null || m === undefined) return;
    let message = '', sender = 'Unknown', dateTime = '', type = 'incoming';

    if (typeof m === 'string') {
      message = m;
    } else if (typeof m === 'object') {
      message = m.message || m.body || m.text || m.msg || m.content || m.sms || '';
      sender = m.sender || m.from || m.number || m.phoneNumber || m.phone || m.address || 'Unknown';
      dateTime = m.dateTime || m.date || m.time || m.timestamp || m.createdAt || m.created_at || '';
      const t = String(m.type || m.direction || m.msgType || 'incoming').toLowerCase();
      type = (t.includes('out') || t.includes('sent')) ? 'outgoing' : 'incoming';
    }

    msgs.push({ key: k, message, sender, dateTime, type, _ts: parseDateTime(dateTime) });
  });

  msgs.sort((a, b) => {
    if (a._ts > 0 && b._ts > 0) return b._ts - a._ts;
    if (a._ts > 0) return -1;
    if (b._ts > 0) return 1;
    return String(b.key).localeCompare(String(a.key));
  });

  return msgs;
}

function parseDateTime(dt) {
  if (!dt) return 0;
  const s = String(dt).trim();
  if (/^\d{10,13}$/.test(s)) return parseInt(s.length === 13 ? s : s + '000');
  const m1 = s.match(/(\d{1,2})[\-\/\.](\d{1,2})[\-\/\.](\d{4}).*?(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?/i);
  if (m1) {
    let h = +m1[4], mn = +m1[5], sec = +(m1[6] || 0);
    const ap = (m1[7] || '').toLowerCase();
    if (ap === 'pm' && h < 12) h += 12;
    if (ap === 'am' && h === 12) h = 0;
    return new Date(+m1[3], +m1[2] - 1, +m1[1], h, mn, sec).getTime();
  }
  const d = new Date(s);
  return isNaN(d.getTime()) ? 0 : d.getTime();
}

// ═══════ MODAL ═══════
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => {
    if (e.target === o) o.classList.remove('open');
  });
});

// ═══════ TOAST ═══════
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ═══════ UTILS ═══════
function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Esc key closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.overlay.open').forEach(o => o.classList.remove('open'));
  }
});
</script>
